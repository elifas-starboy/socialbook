<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="nav-left">
                <img src="images/logo.png" alt="Logo" class="logo">

                <ul>
                    <li><img src="images/notification.png" alt="Notifaction logo"></li>
                    <li><img src="images/inbox.png" alt="inbox logo"></li>
                    <li><img src="images/video.png" alt="video logo"></li>
                </ul>
            </div>
            <div class="nav-right">

                <div class="search-box">
                    <img src="images/search.png" alt="search icon">
                    <input type="text" placeholder="Search">
                </div>

                <div class="nav-user-icon online">
                    <img src="images/profile-pic.png" alt="profile picture">
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- ============== Left-sidebar =========== -->
        <div class="left-sidebar">
            <div class="imp-links">
                <a href="#"><img src="images/news.png" alt="new image"> Latest News</a>
                <a href="##"><img src="images/friends.png" alt="friends image"> Friends</a>
                <a href="###"><img src="images/group.png" alt="group image"> Group</a>
                <a href="####"><img src="images/marketplace.png" alt="marketplace image"> Marketplace</a>
                <a href="#####"><img src="images/watch.png" alt="watch image"> Watch</a>
                <a href="#####">See More</a>
            </div>
            <div class="shortcut-links">
                <p>Your Shortcuts</p>
                <a href="#"><img src="images/shortcut-1.png"> Web Developers</a>
                <a href="##"><img src="images/shortcut-2.png"> Web Design course</a>
                <a href="###"><img src="images/shortcut-3.png"> Full Stack Development</a>
                <a href="####"><img src="images/shortcut-4.png"> Website Experts</a>
            </div>
        </div>

        <!-- ============== main-content =========== -->
        <div class="main-content"></div>

        <!-- ============== Right-sidebar =========== -->
        <div class="right-sidebar"></div>

    </main>
    
</body>
</html>
